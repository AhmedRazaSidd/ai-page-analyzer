<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Outer Glow Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.4" />
    </linearGradient>

    <!-- Left Wing Gradient -->
    <linearGradient id="wingLeft" x1="28" y1="36" x2="70" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Right Wing Gradient -->
    <linearGradient id="wingRight" x1="70" y1="24" x2="100" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Chevron Bottom Gradient -->
    <linearGradient id="chevronGrad" x1="28" y1="80" x2="100" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="116" height="116" rx="28" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Stylized Co-Pilot Webpage Wings -->
  <!-- Left Wing -->
  <path d="M28 36 L70 22 L70 78 L28 92 Z" fill="url(#wingLeft)" opacity="0.95" />

  <!-- Right Wing -->
  <path d="M70 22 L100 36 L100 92 L70 78 Z" fill="url(#wingRight)" opacity="0.95" />

  <!-- Dynamic Lower Chevron (Pilot Vector) -->
  <path d="M28 92 L70 78 L100 92 L64 108 Z" fill="url(#chevronGrad)" />

  <!-- Central AI Spark Core (Perception Star) -->
  <g filter="url(#glow)">
    <!-- 8-point radiant star -->
    <path d="M64 42 Q64 61 45 61 Q64 61 64 80 Q64 61 83 61 Q64 61 64 42 Z" fill="#FFFFFF" />
    <circle cx="64" cy="61" r="3" fill="#38BDF8" />
  </g>
</svg>
